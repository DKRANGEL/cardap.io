<h2>Seu código de acesso</h2>
<p>Use o código abaixo pra entrar no cardap.io:</p>
<p style="font-size: 32px; font-weight: 800; letter-spacing: 6px; margin: 16px 0;">{{ .Token }}</p>
<p>O código vale por alguns minutos. Se você não pediu, pode ignorar este e-mail.</p>
<p>Prefere um link? <a href="{{ .ConfirmationURL }}">Toque aqui pra entrar</a>. Abra neste mesmo aparelho e navegador em que você pediu o acesso.</p>
